<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Avatar</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .hint {
      position: fixed;
      left: 16px;
      right: 16px;
      top: 16px;
      z-index: 10;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 0.95rem;
      text-align: center;
      transition: opacity 0.3s;
    }
    .hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div class="hint" id="hint">カードにカメラを向けてください</div>

  <a-scene
    mindar-image="imageTargetSrc: targets/card.mind; uiScanning: no"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="avatar" src="models/Astronaut.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" intensity="1.5" position="0 -1 2"></a-light>

    <!-- カードの横幅 = 1 として位置と大きさを指定する -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- カードの面から立ち上がるよう X 軸で 90 度回転し、ふわふわ上下させる -->
      <a-entity
        rotation="90 0 0"
        animation__float="property: position; from: 0 0 0; to: 0 0 0.08; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
        <a-gltf-model
          id="avatar-model"
          src="#avatar"
          scale="0 0 0"
          animation__appear="property: scale; from: 0 0 0; to: 0.5 0.5 0.5; dur: 600; easing: easeOutBack; startEvents: appear">
        </a-gltf-model>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const hint = document.getElementById('hint');
    const target = document.getElementById('target');
    const model = document.getElementById('avatar-model');

    target.addEventListener('targetFound', () => {
      hint.classList.add('hidden');
      model.emit('appear');
    });
    target.addEventListener('targetLost', () => {
      hint.classList.remove('hidden');
      model.setAttribute('scale', '0 0 0');
    });
  </script>
</body>
</html>
